[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dti-alps-refined"
version = "0.2.0"
description = "Orientation-aware DTI-ALPS index with FastAPI + React UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Scott N. Hwang", email = "snhwang@gmail.com" },
]
keywords = ["DTI-ALPS", "diffusion MRI", "perivascular", "neuroimaging"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24,<2.0",
  "scipy>=1.11,<2.0",
  "dipy>=1.8,<2.0",
  "nibabel>=5.1,<6.0",
  "fastapi>=0.104,<1.0",
  "uvicorn>=0.24,<1.0",
  "python-multipart>=0.0.6,<1.0",
  "python-dotenv>=1.0,<2.0",
  "jinja2>=3.1,<4.0",
  "aiofiles>=23.2,<24.0",
  "Pillow>=10.0,<11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# SimpleITK is only required if you wire up FLAIR/atlas registration.
# The DTI-ALPS pipeline runs without it; install if you need those features.
sitk = ["SimpleITK>=2.3,<3.0"]

[project.scripts]
dti-alps = "dti_alps_refined.server:main"

[project.urls]
Homepage = "https://github.com/snhwang/dti-alps-refined"

[tool.setuptools.packages.find]
include = ["dti_alps_refined*"]
